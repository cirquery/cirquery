name: Publish cirquery to npm

on:
  push:
    # バージョンアップ時に手動で作成するタグ(push tag)
    tags:
      - 'v*.*.*'   # セマンティックバージョンのタグを検知して自動実行
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # trusted publishing (OIDC) に必須

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      # ソースコードをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node.js をセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # 依存関係インストール
      - name: Install dependencies
        run: npm install

      # TypeScript の型チェック（必要なら）
      - name: Typecheck
        run: npm run typecheck

      # ビルド
      - name: Build cirquery
        run: npm run build

      # trusted publishing には npm 11.5.1+ が必要
      - name: Upgrade npm
        run: npm install -g npm@latest

      # npm 公開（trusted publishing: トークンは使わない）
      - name: Publish to npm
        run: npm publish --access public --provenance
